models:
  vae_name: black-forest-labs/FLUX.2-klein-base-4B
  vae_subfolder: vae
  vae_class: AutoencoderKLFlux2
  vae_scaling_factor: 1.0
  text_encoder_name: Qwen/Qwen3.5-2B-Base

image:
  resolution: 256
  latent_channels: 32
  latent_size: 32

text:
  max_length: 256
  hidden_size: 2048
  attn_implementation: flash_attention_2

transformer:
  sample_size: 64
  patch_size: 2
  in_channels: 32
  out_channels: 32
  num_layers: 40
  num_attention_heads: 16
  attention_head_dim: 128
  cross_attention_dim: 2048
  caption_channels: 2048

scheduler:
  train_timesteps: 1000
  type: flow_matching
  shift: 1.0

train:
  optimizer: adamw8bit
  learning_rate: 0.0001
  lr_scheduler: constant
  batch_size: 8
  aspect_ratio_bucketing:
    enabled: true
    max_area: 98304  # 256 * 384
    max_dim: 512
    min_dim: 256
    step: 64
    drop_last: false
  epochs: 100
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  mixed_precision: bf16
  num_workers: 2
  save_every_steps: 1000
