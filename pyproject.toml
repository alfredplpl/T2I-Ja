[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t2i-ja"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.34.0",
  "diffusers>=0.36.0",
  "huggingface-hub>=0.24.0",
  "pillow>=10.0.0",
  "pyyaml>=6.0.0",
  "safetensors>=0.4.0",
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "transformers>=4.57.0",
]

[project.scripts]
t2i-train = "t2i_ja.cli.train:main"
t2i-infer = "t2i_ja.cli.infer:main"
t2i-export-pipeline = "t2i_ja.cli.export_pipeline:main"

[dependency-groups]
dev = [
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
